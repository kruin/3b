<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>De Waaier · Openen</title><style>
body{margin:0;background:#faf8ef;color:#173b30;font:17px/1.5 system-ui}main{max-width:680px;margin:8vh auto;padding:24px}h1{margin:0;font-size:32px}p{margin:8px 0 24px}nav{display:grid;gap:12px}nav a{display:block;padding:18px 20px;border:1px solid #b3c6bb;border-radius:10px;color:inherit;text-decoration:none;background:white}nav a:first-child{background:#176f4f;color:white;border-color:#176f4f}nav strong,nav span{display:block}nav strong{font-size:21px}nav span{margin-top:4px;font-size:15px}a:focus-visible{outline:3px solid #b98d24;outline-offset:3px}[hidden]{display:none!important}
</style></head><body><main id="kruinStart" hidden><h1>De Waaier</h1><p>Kruin · kies waar je wilt beginnen.</p><nav aria-label="Start voor Kruin"><a id="startCourse" href="./?mode=user&amp;entry=course#owner=user"><strong>Cursus</strong><span>Stap voor stap, zoals U de cursus ziet. Met Kruins tafel.</span></a><a id="startSystem" href="doc/meetsysteem.html?role=kruin"><strong>Meetsysteem</strong><span>De basis: 0, waaier, patroon, spoor en parallel.</span></a><a id="startTableConfig" href="./?entry=table#owner=kruin"><strong>Tafel / Config</strong><span>De tafel en het GitHub-werkbestand beheren.</span></a></nav></main><main id="opening"><p>De actuele versie wordt geopend…</p><a id="openCurrent" href="./">Open 3B</a></main><script>
(() => {
 function fresh(owner,entry){const target=new URL('./',location.href),hash=new URLSearchParams(location.hash.slice(1));hash.set('owner',owner);target.hash=hash.toString();target.searchParams.set('entry',entry);if(owner==='user')target.searchParams.set('mode','user');target.searchParams.set('_open',Date.now()+'-'+Math.random().toString(36).slice(2));return target;}
 function open(){const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1)),owner=hash.get('owner')==='kruin'?'kruin':'user';if(owner==='kruin'&&params.get('entry')!=='table'&&!hash.has('tableView')){document.getElementById('opening').hidden=true;document.getElementById('kruinStart').hidden=false;document.title='De Waaier · Kruin';document.getElementById('startCourse').href=fresh('user','course').href;document.getElementById('startTableConfig').href=fresh('kruin','table').href;return;}const target=fresh(owner,params.get('entry')==='table'?'table':'course');document.getElementById('openCurrent').href=target.href;location.replace(target.href);}
 window.addEventListener('pageshow',event=>{if(event.persisted)open();});open();
})();
</script></body></html>
